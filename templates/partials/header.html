<header class="site-header">
  <nav class="navbar navbar-expand-lg py-3">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="{% url 'core:home' %}">
        {% if site_settings.logo %}
          <img src="{{ site_settings.logo.url }}" alt="{{ site_settings.site_name }}" height="42">
        {% else %}
          <i class="fa-solid fa-bolt text-orange"></i> {{ site_settings.site_name }}
        {% endif %}
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto align-items-lg-center">
          <li class="nav-item"><a class="nav-link" href="{% url 'core:home' %}">خانه</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'pages:about' %}">درباره ما</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'products:product_list' %}">محصولات</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'services:service_list' %}">خدمات</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'projects:project_list' %}">پروژه‌ها</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'gallery:gallery_list' %}">گالری</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'blog:post_list' %}">وبلاگ</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'contact:contact' %}">تماس با ما</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'products:wishlist' %}" title="علاقه‌مندی‌ها"><i class="fa-regular fa-heart"></i></a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'products:compare' %}" title="مقایسه محصولات"><i class="fa-solid fa-scale-balanced"></i></a></li>
          <li class="nav-item">
            <a class="nav-link position-relative" href="{% url 'shop:cart_detail' %}" title="سبد خرید">
              <i class="fa-solid fa-cart-shopping"></i>
              {% if cart_items_count %}<span id="cart-count-badge" class="badge bg-orange rounded-pill position-absolute" style="top:-5px;right:-8px;font-size:.6rem;">{{ cart_items_count }}</span>{% endif %}
            </a>
          </li>
          <li class="nav-item ms-lg-3">
            <a class="btn btn-orange" href="{% url 'contact:quote_request' %}">درخواست استعلام قیمت</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>
</header>
