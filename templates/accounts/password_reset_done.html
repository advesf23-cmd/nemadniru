{% extends "base.html" %}
{% block title %}ایمیل ارسال شد - {{ site_settings.site_name }}{% endblock %}
{% block content %}
<section class="section-padding text-center">

    <i class="fa-solid fa-envelope-circle-check fa-4x text-orange mb-4"></i>
    <h2>ایمیل بازیابی ارسال شد</h2>
    <p class="text-muted">اگر حسابی با این ایمیل وجود داشته باشد، لینک بازیابی رمز عبور برایتان ارسال شده است.</p>
    <a href="{% url 'accounts:login' %}" class="btn btn-orange btn-lg mt-3">بازگشت به صفحه ورود</a>
  </div>
</section>
{% endblock %}
